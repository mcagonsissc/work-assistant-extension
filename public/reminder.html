<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Workday reminder</title>
<style>body{margin:0;min-height:100vh;display:flex;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:14px;background:#0f1214;color:#e9edeb}main{flex:1;display:flex;flex-direction:column;gap:8px;padding:18px}h1{font-size:17px;margin:0}p{margin:0;color:#99a5a4;line-height:1.45;overflow-wrap:anywhere;flex:1}div{display:flex;gap:8px;justify-content:flex-end}button{font:inherit;font-weight:550;font-size:13px;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid #2a3136;background:#171b1e;color:#e9edeb}button#open{background:#8fdc9a;color:#0f2414;border-color:transparent}button:focus-visible{outline:2px solid #8fdc9a;outline-offset:2px}@media(prefers-color-scheme:light){body{background:#f6f7f5;color:#1c2620}p{color:#5d6b63}button{background:#fff;color:#1c2620;border-color:#dfe4df}button#open{background:#2f7a3c;color:#fff}}</style></head>
